# postgresql.conf — OA de Otimização de Queries PostgreSQL
# Configuração mínima para habilitar pg_stat_statements e monitoramento

# Extensão de monitoramento de queries
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# Estatísticas e autovacuum
track_counts = on
autovacuum = on
log_autovacuum_min_duration = 0

# Configurações de memória (ajuste conforme disponibilidade)
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Logging básico (opcional — útil para depuração)
log_min_duration_statement = 1000
log_statement = 'ddl'
